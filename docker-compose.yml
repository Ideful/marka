# Публичный сайт, MinIO, PostgreSQL.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # args (опционально): NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_BOOKING_URL
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio_s3
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
    volumes:
      - ./data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: marka_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: marka
      POSTGRES_PASSWORD: marka
      POSTGRES_DB: marka
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marka -d marka"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
