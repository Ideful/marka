openapi: 3.0.3
info:
  title: Marka API
  version: 0.1.0
  description: API салона МАРКА

servers:
  - url: http://localhost:3001
    description: Локальная разработка

tags:
  - name: services
    description: Категории услуг
  - name: sub-services
    description: Позиции прайса (подуслуги)
  - name: specialists
    description: Специалисты салона
  - name: uploads
    description: Загрузка файлов (MinIO)

paths:
  /main-services:
    get:
      operationId: listMainServices
      summary: Каталог — все направления с типами услуг
      tags:
        - services
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MainService"

  /main-services/{slug}:
    get:
      operationId: getMainService
      summary: Направление с типами услуг и подуслугами
      tags:
        - services
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MainService"
        "404":
          description: Не найдено

  /main-services/{slug}/services/{serviceSlug}:
    get:
      operationId: getServiceType
      summary: Тип услуги с подуслугами (прайс)
      tags:
        - services
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: serviceSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceType"
        "404":
          description: Не найдено

  /sub-services:
    get:
      operationId: listSubServices
      summary: Подуслуги по service_type_id
      tags:
        - sub-services
      parameters:
        - name: service_type_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubService"
    post:
      operationId: createSubService
      summary: Создать подуслугу
      tags:
        - sub-services
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubServiceInput"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubService"

  /services:
    get:
      operationId: getServices
      summary: "(deprecated) Используйте GET /main-services"
      deprecated: true
      tags:
        - services
      responses:
        "200":
          description: Список категорий с подуслугами
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegacyService"

  /sub-services/{id}:
    get:
      operationId: getSubService
      summary: Подуслуга по id
      tags:
        - sub-services
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubService"
        "404":
          description: Не найдено
    put:
      operationId: updateSubServiceById
      summary: Обновить подуслугу по id
      tags:
        - sub-services
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор подуслуги
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubServiceInput"
      responses:
        "200":
          description: Обновлённая подуслуга
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubService"
        "400":
          description: Некорректное тело запроса
        "404":
          description: Подуслуга с таким id не найдена
    delete:
      operationId: deleteSubService
      summary: Удалить подуслугу
      tags:
        - sub-services
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Удалена
        "404":
          description: Не найдена

  /uploads/specialist-photo:
    post:
      operationId: uploadSpecialistPhoto
      summary: Загрузить фото специалиста в MinIO
      tags:
        - uploads
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: URL загруженного файла
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPhotoResponse"
        "400":
          description: Некорректный файл

  /specialists:
    get:
      operationId: listSpecialists
      summary: Список специалистов
      tags:
        - specialists
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Specialist"
    post:
      operationId: createSpecialist
      summary: Создать специалиста
      tags:
        - specialists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialistInput"
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialist"
        "400":
          description: Некорректное тело

  /specialists/{id}:
    get:
      operationId: getSpecialist
      summary: Специалист по id
      tags:
        - specialists
      parameters:
        - $ref: "#/components/parameters/SpecialistId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialist"
        "404":
          description: Не найден
    put:
      operationId: updateSpecialist
      summary: Обновить специалиста
      tags:
        - specialists
      parameters:
        - $ref: "#/components/parameters/SpecialistId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialistInput"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialist"
        "404":
          description: Не найден
    delete:
      operationId: deleteSpecialist
      summary: Удалить специалиста
      tags:
        - specialists
      parameters:
        - $ref: "#/components/parameters/SpecialistId"
      responses:
        "204":
          description: Удалён
        "404":
          description: Не найден

components:
  parameters:
    SpecialistId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    DescriptionSection:
      type: object
      properties:
        title:
          type: string
          description: Заголовок блока (жирный на сайте)
          example: Образование
        description:
          type: string
          description: Текст под заголовком
          example: Академия красоты «Эколь», 2019 год.

    Portfolio:
      type: object
      properties:
        photo_url:
          type: string
          description: URL фото кейса/работы
          example: https://example.com/portfolio-1.jpg
        description:
          type: string
          description: Комментарий к фото (что сделано)
          example: AirTouch + тонирование в холодный блонд.

    Specialist:
      type: object
      required:
        - id
        - name
        - class
        - description
        - portfolio
        - photo_url
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        class:
          type: string
          enum: [master, top_master, stylist, top_stylist, art_director]
          description: Уровень специалиста (как в прайсе)
          example: stylist
        description:
          type: array
          items:
            $ref: "#/components/schemas/DescriptionSection"
        portfolio:
          type: array
          items:
            $ref: "#/components/schemas/Portfolio"
        photo_url:
          type: string
          example: https://example.com/photo.jpg

    SpecialistInput:
      type: object
      required:
        - name
        - class
      properties:
        name:
          type: string
        class:
          type: string
          enum: [master, top_master, stylist, top_stylist, art_director]
          example: master
        description:
          type: array
          items:
            $ref: "#/components/schemas/DescriptionSection"
        portfolio:
          type: array
          items:
            $ref: "#/components/schemas/Portfolio"
        photo_url:
          type: string
          description: URL фото после POST /uploads/specialist-photo

    UploadPhotoResponse:
      type: object
      required:
        - url
        - key
      properties:
        url:
          type: string
          example: http://localhost:9000/marka/specialists/uuid.jpg
        key:
          type: string
          example: specialists/uuid.jpg

    MainService:
      type: object
      required: [id, slug, name, services]
      properties:
        id:
          type: integer
        slug:
          type: string
          example: hair
        name:
          type: string
          example: Парикмахерские услуги
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceType"

    ServiceType:
      type: object
      required: [id, slug, name, description]
      properties:
        id:
          type: integer
        slug:
          type: string
          example: strizhka
        name:
          type: string
          example: Стрижка
        description:
          type: string
        sub_services:
          type: array
          items:
            $ref: "#/components/schemas/SubService"

    SubServiceInput:
      type: object
      required: [service_type_id, name, prices]
      properties:
        service_type_id:
          type: integer
        name:
          type: string
        description:
          type: string
        prices:
          $ref: "#/components/schemas/GenderedPrices"
        sort_order:
          type: integer

    LegacyService:
      type: object
      description: Категория услуг; подуслуги — только в `items`
      required:
        - id
        - name
        - description
        - items
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Парикмахерский зал
        description:
          type: string
          example: Стрижки, уход, укладки
        items:
          type: array
          description: Подуслуги (строки прайса) внутри категории
          items:
            $ref: "#/components/schemas/SubService"

    TierPrices:
      type: object
      description: Цены по типу специалиста (рубли, целое число; 0 = не указано)
      required:
        - master
        - top_master
        - stylist
        - top_stylist
        - art_director
      properties:
        master:
          type: integer
          minimum: 0
          example: 2000
        top_master:
          type: integer
          minimum: 0
        stylist:
          type: integer
          minimum: 0
        top_stylist:
          type: integer
          minimum: 0
        art_director:
          type: integer
          minimum: 0

    GenderedPrices:
      type: object
      description: Цены для женщин и мужчин
      required:
        - female
        - male
      properties:
        female:
          $ref: "#/components/schemas/TierPrices"
        male:
          $ref: "#/components/schemas/TierPrices"

    SubService:
      type: object
      description: Строка прайса (подуслуга) с матрицей цен
      required:
        - id
        - name
        - description
        - prices
        - sort_order
      properties:
        id:
          type: integer
          format: int64
          example: 111
        name:
          type: string
          example: Стрижка (пример)
        description:
          type: string
          example: Модельная стрижка по длине и типу волос.
        prices:
          $ref: "#/components/schemas/GenderedPrices"
        sort_order:
          type: integer
          example: 0
