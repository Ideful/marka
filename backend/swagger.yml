openapi: 3.0.3
info:
  title: Marka API
  version: 0.1.0
  description: API салона МАРКА

servers:
  - url: http://localhost:3001
    description: Локальная разработка

tags:
  - name: services
    description: Каталог услуг
  - name: prices
    description: Цены (услуги в разделе)
  - name: specialists
    description: Специалисты салона
  - name: uploads
    description: Загрузка файлов (MinIO)
  - name: site-settings
    description: Настройки сайта (главная, бегущая строка)

paths:
  /main-services:
    get:
      operationId: listMainServices
      summary: Каталог — все направления с разделами
      tags:
        - services
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MainService"

  /main-services/{slug}:
    get:
      operationId: getMainService
      summary: Направление с разделами и услугами
      tags:
        - services
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MainService"
        "404":
          description: Не найдено

  /main-services/{slug}/sections/{sectionSlug}:
    get:
      operationId: getSection
      summary: Раздел с услугами (прайс)
      tags:
        - services
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: sectionSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
        "404":
          description: Не найдено

  /prices:
    get:
      operationId: listServices
      summary: Услуги по section_id
      tags:
        - prices
      parameters:
        - name: section_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      summary: Создать услугу
      tags:
        - prices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"

  /services:
    get:
      operationId: getServices
      summary: "(deprecated) Используйте GET /main-services"
      deprecated: true
      tags:
        - services
      responses:
        "200":
          description: Список категорий с подуслугами
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegacyService"

  /prices/{id}:
    get:
      operationId: getService
      summary: Услуга по id
      tags:
        - prices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Не найдено
    put:
      operationId: updateServiceById
      summary: Обновить услугу по id
      tags:
        - prices
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор услуги
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "200":
          description: Обновлённая услуга
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          description: Некорректное тело запроса
        "404":
          description: Услуга с таким id не найдена
    delete:
      operationId: deleteService
      summary: Удалить услугу
      tags:
        - prices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Удалена
        "404":
          description: Не найдена

  /uploads/specialist-photo:
    post:
      operationId: uploadSpecialistPhoto
      summary: Загрузить фото специалиста в MinIO
      tags:
        - uploads
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: URL загруженного файла
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPhotoResponse"
        "400":
          description: Некорректный файл

        "400":
          description: Некорректный файл

  /uploads/site-photo:
    post:
      operationId: uploadSitePhoto
      summary: Загрузить фото для блоков главной (портфолио, сертификат)
      tags:
        - uploads
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: URL загруженного файла
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPhotoResponse"
        "400":
          description: Некорректный файл

  /site-settings/marquee:
    get:
      operationId: getMarqueeSettings
      summary: Текст бегущей строки
      tags:
        - site-settings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarqueeSettings"
    put:
      operationId: updateMarqueeSettings
      summary: Обновить текст бегущей строки
      tags:
        - site-settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarqueeSettings"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarqueeSettings"

  /site-settings/homepage-portfolio:
    get:
      operationId: getHomepagePortfolio
      summary: Портфолио на главной
      tags:
        - site-settings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepagePortfolioSettings"
    put:
      operationId: updateHomepagePortfolio
      summary: Обновить портфолио на главной
      tags:
        - site-settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomepagePortfolioSettings"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepagePortfolioSettings"

  /site-settings/gift-certificate:
    get:
      operationId: getGiftCertificateSettings
      summary: Подарочный сертификат (главная и страница)
      tags:
        - site-settings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftCertificateSettings"
    put:
      operationId: updateGiftCertificateSettings
      summary: Обновить подарочный сертификат
      tags:
        - site-settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiftCertificateSettings"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftCertificateSettings"

  /specialists:
    get:
      operationId: listSpecialists
      summary: Список специалистов
      tags:
        - specialists
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Specialist"
    post:
      operationId: createSpecialist
      summary: Создать специалиста
      tags:
        - specialists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialistInput"
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialist"
        "400":
          description: Некорректное тело

  /specialists/{id}:
    get:
      operationId: getSpecialist
      summary: Специалист по id
      tags:
        - specialists
      parameters:
        - $ref: "#/components/parameters/SpecialistId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialist"
        "404":
          description: Не найден
    put:
      operationId: updateSpecialist
      summary: Обновить специалиста
      tags:
        - specialists
      parameters:
        - $ref: "#/components/parameters/SpecialistId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialistInput"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialist"
        "404":
          description: Не найден
    delete:
      operationId: deleteSpecialist
      summary: Удалить специалиста
      tags:
        - specialists
      parameters:
        - $ref: "#/components/parameters/SpecialistId"
      responses:
        "204":
          description: Удалён
        "404":
          description: Не найден

components:
  parameters:
    SpecialistId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    DescriptionSection:
      type: object
      properties:
        title:
          type: string
          description: Заголовок блока (жирный на сайте)
          example: Образование
        description:
          type: string
          description: Текст под заголовком
          example: Академия красоты «Эколь», 2019 год.

    Portfolio:
      type: object
      properties:
        photo_url:
          type: string
          description: URL фото кейса/работы
          example: https://example.com/portfolio-1.jpg
        description:
          type: string
          description: Комментарий к фото (что сделано)
          example: AirTouch + тонирование в холодный блонд.

    Specialist:
      type: object
      required:
        - id
        - name
        - class
        - description
        - portfolio
        - photo_url
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        class:
          type: string
          enum: [master, top_master, stylist, top_stylist, art_director]
          description: Уровень специалиста (как в прайсе)
          example: stylist
        description:
          type: array
          items:
            $ref: "#/components/schemas/DescriptionSection"
        portfolio:
          type: array
          items:
            $ref: "#/components/schemas/Portfolio"
        photo_url:
          type: string
          example: https://example.com/photo.jpg

    SpecialistInput:
      type: object
      required:
        - name
        - class
      properties:
        name:
          type: string
        class:
          type: string
          enum: [master, top_master, stylist, top_stylist, art_director]
          example: master
        description:
          type: array
          items:
            $ref: "#/components/schemas/DescriptionSection"
        portfolio:
          type: array
          items:
            $ref: "#/components/schemas/Portfolio"
        photo_url:
          type: string
          description: URL фото после POST /uploads/specialist-photo

    UploadPhotoResponse:
      type: object
      required:
        - url
        - key
      properties:
        url:
          type: string
          example: http://localhost:9000/marka/specialists/uuid.jpg
        key:
          type: string
          example: specialists/uuid.jpg

    MarqueeSettings:
      type: object
      properties:
        text:
          type: string

    HomepagePortfolioSettings:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Portfolio"

    GiftCertificateSettings:
      type: object
      properties:
        photo_url:
          type: string
        teaser_text:
          type: string
          description: Текст блока на главной
        page_text:
          type: string
          description: Текст на странице /certificates

    MainService:
      type: object
      required: [id, slug, name, services]
      properties:
        id:
          type: integer
        slug:
          type: string
          example: hair
        name:
          type: string
          example: Парикмахерские услуги
        services:
          type: array
          items:
            $ref: "#/components/schemas/Section"

    Section:
      type: object
      required: [id, slug, name, description]
      properties:
        id:
          type: integer
        slug:
          type: string
          example: strizhka
        name:
          type: string
          example: Стрижка
        description:
          type: string
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"

    LengthPrices:
      type: object
      description: Цены по длине волос (рубли; 0 = не указано)
      properties:
        short:
          type: integer
          minimum: 0
        medium:
          type: integer
          minimum: 0
        long:
          type: integer
          minimum: 0

    ServiceInput:
      type: object
      required: [section_id, name]
      properties:
        section_id:
          type: integer
        name:
          type: string
        description:
          type: string
        prices:
          $ref: "#/components/schemas/GenderedPrices"
        length_prices:
          $ref: "#/components/schemas/LengthPrices"
        sort_order:
          type: integer

    LegacyService:
      type: object
      description: Категория услуг; строки прайса — только в `items`
      required:
        - id
        - name
        - description
        - items
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Парикмахерский зал
        description:
          type: string
          example: Стрижки, уход, укладки
        items:
          type: array
          description: Услуги (строки прайса) внутри категории
          items:
            $ref: "#/components/schemas/Service"

    TierPrices:
      type: object
      description: Цены по типу специалиста (рубли, целое число; 0 = не указано)
      required:
        - master
        - top_master
        - stylist
        - top_stylist
        - art_director
      properties:
        master:
          type: integer
          minimum: 0
          example: 2000
        top_master:
          type: integer
          minimum: 0
        stylist:
          type: integer
          minimum: 0
        top_stylist:
          type: integer
          minimum: 0
        art_director:
          type: integer
          minimum: 0

    GenderedPrices:
      type: object
      description: Цены для женщин и мужчин
      required:
        - female
        - male
      properties:
        female:
          $ref: "#/components/schemas/TierPrices"
        male:
          $ref: "#/components/schemas/TierPrices"

    Service:
      type: object
      description: Услуга (строка прайса) с матрицей цен
      required:
        - id
        - name
        - description
        - sort_order
      properties:
        id:
          type: integer
          format: int64
          example: 111
        name:
          type: string
          example: Стрижка (пример)
        description:
          type: string
          example: Модельная стрижка по длине и типу волос.
        prices:
          $ref: "#/components/schemas/GenderedPrices"
        length_prices:
          $ref: "#/components/schemas/LengthPrices"
        sort_order:
          type: integer
          example: 0
